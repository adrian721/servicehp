<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental UT - Sewa UnlockTool Otomatis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center text-amber-400 mb-2">Rental UnlockTool</h1>
    <p class="text-xs text-center text-slate-400 mb-6">Proses Otomatis 24 Jam via QRIS</p>

    <!-- FORM SEWA -->
    <form id="rentalForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nomor WhatsApp</label>
        <input type="number" id="whatsapp" required placeholder="08123456789" class="w-full bg-slate-700 text-white rounded-lg p-3 border border-slate-600 focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Pilih Paket Durasi</label>
        <select id="paket" class="w-full bg-slate-700 text-white rounded-lg p-3 border border-slate-600 focus:outline-none focus:border-amber-400">
          <option value="">-- Memuat Paket... --</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition">Sewa Sekarang</button>
    </form>

    <!-- MODAL PEMBAYARAN -->
    <div id="paymentArea" class="hidden mt-6 pt-6 border-t border-slate-700 text-center">
      <p class="text-sm text-slate-300 mb-2">Scan QRIS di bawah ini:</p>
      
      <div id="qrcode" class="flex justify-center p-3 bg-white rounded-xl w-max mx-auto my-3"></div>

      <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 my-3">
        <p class="text-xs text-amber-300">Transfer Tepat Sebesar:</p>
        <p id="totalPay" class="text-2xl font-bold text-amber-400 my-1">Rp 0</p>
        <p class="text-[10px] text-amber-200">*Termasuk kode unik agar terverifikasi otomatis</p>
      </div>

      <button onclick="cekPembayaran()" id="btnCek" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2 rounded-lg text-sm transition">Cek Status Pembayaran</button>
      
      <!-- KOTAK AKUN / LISENSI -->
      <div id="accountBox" class="hidden mt-4 p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-left">
        <p class="text-xs text-emerald-400 font-bold mb-1">Pembayaran Sukses! Detail Akun Anda:</p>
        <p id="accountDetail" class="font-mono text-sm bg-slate-900 p-2 rounded text-emerald-300 select-all"></p>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN URL APPS SCRIPT HASIL DEPLOY DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwaDAdmYe9_rP7OLv1CdPSwxxc71QVw1T1HQmHvJHAYRNWglN7B1MsjMOeD3b0K9XjkdA/exec"; 
    let currentOrderId = null;

    // Memuat paket otomatis saat web dibuka
    async function loadProducts() {
      const selectEl = document.getElementById('paket');
      try {
        const res = await fetch(`${GAS_URL}?action=getProducts`);
        const data = await res.json();
        if (data.status === "SUCCESS" && data.products.length > 0) {
          selectEl.innerHTML = "";
          data.products.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.harga;
            opt.innerText = `${p.nama} - Rp ${Number(p.harga).toLocaleString('id-ID')}`;
            selectEl.appendChild(opt);
          });
        }
      } catch (err) {
        selectEl.innerHTML = '<option value="">Gagal memuat produk</option>';
      }
    }
    window.addEventListener('DOMContentLoaded', loadProducts);

    // Submit Form Pesanan
    document.getElementById('rentalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Processing...";
      btn.disabled = true;

      const whatsapp = document.getElementById('whatsapp').value;
      const select = document.getElementById('paket');
      const harga = select.value;
      const paket = select.options[select.selectedIndex].text;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ whatsapp, harga, paket })
        });
        
        const data = await res.json();

       if (data.status === "SUCCESS") {
  currentOrderId = data.orderId;
  document.getElementById('totalPay').innerText = "Rp " + Number(data.totalPay).toLocaleString('id-ID');
  
  // BUAT QRIS DINAMIK DENGAN NOMINAL OTOMATIS
  const dynamicQrisString = makeDynamicQris(data.qrisString, data.totalPay);
  
  document.getElementById('qrcode').innerHTML = "";
  new QRCode(document.getElementById("qrcode"), {
    text: dynamicQrisString, // Menggunakan string dinamik yang sudah di-inject nominal
    width: 180,
    height: 180,
    correctLevel: QRCode.CorrectLevel.L
  });

  document.getElementById('paymentArea').classList.remove('hidden');
}
        } else {
          alert("Gagal membuat pesanan.");
        }

      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      } finally {
        btn.innerText = "Sewa Sekarang";
        btn.disabled = false;
      }
    });

    // Fungsi untuk menyisipkan nominal otomatis ke dalam String QRIS Statis
function makeDynamicQris(qrisStatis, nominal) {
  // Potong checksum 4 karakter terakhir dari QRIS Statis (tag 6304)
  let baseQris = qrisStatis.slice(0, -8); 
  
  // Format tag 54 (Transaction Amount) sesuai standar QRIS / EMVCo
  let strAmount = nominal.toString();
  let tag54 = "54" + (strAmount.length < 10 ? "0" + strAmount.length : strAmount.length) + strAmount;
  
  // Gabungkan QRIS dasar dengan Tag 54 dan Tag 58 (ID) + Tag 6304 (CRC)
  let rawQris = baseQris + tag54 + "5802ID6304";
  
  // Hitung ulang Checksum CRC16
  let crc = crc16(rawQris).toUpperCase();
  while (crc.length < 4) crc = "0" + crc;
  
  return rawQris + crc;
}

// Helper Hitung CRC16 Standar QRIS (CCITT-FALSE)
function crc16(str) {
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) {
        crc = (crc << 1) ^ 0x1021;
      } else {
        crc = crc << 1;
      }
    }
  }
  return (crc & 0xFFFF).toString(16);
}
    
    // Fungsi Cek Pembayaran
    async function cekPembayaran() {
  if (!currentOrderId) {
    alert("ID Pesanan tidak ditemukan. Silakan buat pesanan baru.");
    return;
  }

  const btn = document.getElementById('btnCek');
  btn.innerText = "Mengecek...";
  btn.disabled = true;

  try {
    // Menggunakan URLSearchParams agar parameter aman & menambahkan timestamp anti-cache
    const url = `${GAS_URL}?orderId=${encodeURIComponent(currentOrderId)}&_=${Date.now()}`;
    
    // Request fetch sederhana tanpa header khusus agar tidak memicu CORS Preflight
    const res = await fetch(url);
    const rawText = await res.text();
    
    // Parse JSON secara aman
    let data;
    try {
      data = JSON.parse(rawText);
    } catch (parseErr) {
      console.error("Gagal membaca format JSON dari server:", rawText);
      alert("Respons server tidak valid. Cek konsol browser.");
      btn.innerText = "Cek Status Pembayaran";
      btn.disabled = false;
      return;
    }

    if (data.status === "SUCCESS") {
      document.getElementById('accountBox').classList.remove('hidden');
      document.getElementById('accountDetail').innerText = data.account;
      btn.innerText = "Lunas!";
    } else if (data.status === "PENDING") {
      alert("Pembayaran belum terdeteksi. Pastikan nominal transfer sesuai sampai 3 digit terakhir.");
      btn.innerText = "Cek Status Pembayaran";
      btn.disabled = false;
    } else if (data.status === "NOT_FOUND") {
      alert("Data order ini tidak ditemukan di sistem Google Sheets.");
      btn.innerText = "Cek Status Pembayaran";
      btn.disabled = false;
    } else {
      alert("Status: " + data.status);
      btn.innerText = "Cek Status Pembayaran";
      btn.disabled = false;
    }

  } catch (err) {
    console.error("Detail Error Fetch:", err);
    alert("Gagal terhubung ke server. Cek koneksi atau coba beberapa saat lagi.");
    btn.innerText = "Cek Status Pembayaran";
    btn.disabled = false;
  }
}
  </script>
</body>
</html>
