<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WTF APP</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">WTF APP</h1>
        <p class="text-slate-400 text-sm mt-1">Sistem Input & Cek Data Nasabah</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Username</label>
          <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Password</label>
          <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded transition">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD APP (HIDDEN BY DEFAULT) -->
  <div id="dashboard" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-blue-500">WTF APP</h1>
          <span id="userInfo" class="text-xs text-slate-400">Loading user...</span>
        </div>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded text-white">Logout</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto w-full p-4 flex-1 space-y-6">
      
      <!-- MENU CEK & FILTER DATA -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">🔍 Pengecekan Data Nasabah</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
          <input type="text" id="searchNik" placeholder="Cari NIK..." class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
          
          <select id="filterAngsuran" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            <option value="">-- Semua Angsuran --</option>
            <option value="3_plus">Angsuran > 3 Bulan</option>
          </select>

          <select id="filterApproval" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            <option value="">-- Semua Approval --</option>
            <option value="YA">Approval: YA</option>
            <option value="TIDAK">Approval: TIDAK</option>
          </select>

          <select id="filterLimit" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            <option value="">-- Semua Limit --</option>
            <option value="1m_plus">Limit Sisa > Rp 1.000.000</option>
          </select>
        </div>
        <button onclick="loadAndFilterNasabah()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white text-sm px-5 py-2 rounded">Cari & Filter Data</button>

        <!-- Tabel Hasil -->
        <div class="overflow-x-auto mt-4">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900 text-slate-400 uppercase">
              <tr>
                <th class="p-2.5">NIK</th>
                <th class="p-2.5">Nama</th>
                <th class="p-2.5">Finance</th>
                <th class="p-2.5">Pinjaman</th>
                <th class="p-2.5">Sisa Limit</th>
                <th class="p-2.5">Angsuran Ke</th>
                <th class="p-2.5">Approval</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-700">
              <tr><td colspan="7" class="p-4 text-center text-slate-500">Klik "Cari & Filter Data" untuk memuat data.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- FORM INPUT NASABAH -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-bold text-white mb-4">📝 Form Input Data Nasabah</h2>
        <form id="nasabahForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
          
          <div>
            <label class="text-slate-400 block mb-1">NIK</label>
            <input type="text" id="inputNik" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Nama Nasabah</label>
            <input type="text" id="inputNama" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">No. Telp</label>
            <input type="text" id="inputTelp" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>

          <div class="md:col-span-3">
            <label class="text-slate-400 block mb-1">Alamat</label>
            <input type="text" id="inputAlamat" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>

          <div>
            <label class="text-slate-400 block mb-1">Kontak Darurat 1</label>
            <input type="text" id="inputKontak1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Telp Kontak Darurat 1</label>
            <input type="text" id="inputTelp1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Kontak Darurat 2</label>
            <input type="text" id="inputKontak2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Telp Kontak Darurat 2</label>
            <input type="text" id="inputTelp2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>

          <!-- Dropdown Finance & Tambah Finance -->
          <div>
            <label class="text-slate-400 block mb-1">Finance</label>
            <div class="flex gap-1">
              <select id="inputFinance" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></select>
              <button type="button" id="btnAddFinance" onclick="addFinanceOption()" class="hidden bg-emerald-600 text-white px-2 rounded hover:bg-emerald-700">+</button>
            </div>
          </div>

          <div>
            <label class="text-slate-400 block mb-1">Unit yang Dikredit</label>
            <input type="text" id="inputUnit" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Limit Kredit (Rp)</label>
            <input type="number" id="inputLimit" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Jumlah Pinjaman (Rp)</label>
            <input type="number" id="inputPinjaman" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Tenor (Bulan)</label>
            <input type="number" id="inputTenor" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Angsuran Ke-</label>
            <input type="number" id="inputAngsuran" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Tgl Jatuh Tempo</label>
            <input type="date" id="inputTglJatuhTempo" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Program</label>
            <input type="text" id="inputProgram" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Approval</label>
            <select id="inputApproval" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
              <option value="YA">YA</option>
              <option value="TIDAK">TIDAK</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="text-slate-400 block mb-1">Keterangan</label>
            <input type="text" id="inputKeterangan" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
          </div>

          <div class="md:col-span-3 mt-2">
            <button type="submit" id="btnSubmitNasabah" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded font-semibold text-sm">SIMPAN DATA NASABAH</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // PASTE WEB APP URL DARI GOOGLE APPS SCRIPT ANDA DI SINI!
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzxxiTfo71CKJgjMlPVmfcyP9TXpqzos08aKfwrgS9s_Q20r1i4aQLnVkxqNt61HNQO/exec"; 

    let currentUser = null;

    // Register Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Login Form Event Listener
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Processing...";
      
      const payload = {
        action: 'login',
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        
        if (data.status === 'success') {
          currentUser = data;
          document.getElementById('loginPage').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('userInfo').innerText = `Logged in as: ${data.nama} (${data.role.toUpperCase()})`;

          // Tampilkan tombol Tambah Finance khusus Admin
          if (data.role === 'admin') {
            document.getElementById('btnAddFinance').classList.remove('hidden');
          }
          loadFinanceDropdown();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Gagal koneksi ke server Apps Script!");
      } finally {
        btn.innerText = "LOGIN";
      }
    });

    // Load Dropdown Finance dari Google Sheets
    async function loadFinanceDropdown() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getFinance`);
        const data = await res.json();
        const select = document.getElementById('inputFinance');
        select.innerHTML = '';
        data.data.forEach(item => {
          if (item) select.innerHTML += `<option value="${item}">${item}</option>`;
        });
      } catch (e) {
        console.error("Gagal load finance", e);
      }
    }

    // Tambah Opsi Finance Baru (Admin Only)
    async function addFinanceOption() {
      const nama = prompt("Masukkan Nama Finance Baru:");
      if (!nama) return;
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addFinance', namaFinance: nama })
      });
      const data = await res.json();
      alert(data.message);
      loadFinanceDropdown();
    }

    // Simpan Data Nasabah
    document.getElementById('nasabahForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitNasabah');
      btn.innerText = "Menyimpan...";

      const payload = {
        action: 'saveNasabah',
        nik: document.getElementById('inputNik').value,
        nama: document.getElementById('inputNama').value,
        alamat: document.getElementById('inputAlamat').value,
        noTelp: document.getElementById('inputTelp').value,
        kontak1: document.getElementById('inputKontak1').value,
        telp1: document.getElementById('inputTelp1').value,
        kontak2: document.getElementById('inputKontak2').value,
        telp2: document.getElementById('inputTelp2').value,
        finance: document.getElementById('inputFinance').value,
        limitKredit: document.getElementById('inputLimit').value,
        jumlahPinjaman: document.getElementById('inputPinjaman').value,
        unit: document.getElementById('inputUnit').value,
        tenor: document.getElementById('inputTenor').value,
        angsuranKe: document.getElementById('inputAngsuran').value,
        tglJatuhTempo: document.getElementById('inputTglJatuhTempo').value,
        program: document.getElementById('inputProgram').value,
        keterangan: document.getElementById('inputKeterangan').value,
        approval: document.getElementById('inputApproval').value,
        createdBy: currentUser.nama
      };

      try {
        const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        alert(data.message);
        document.getElementById('nasabahForm').reset();
      } catch (e) {
        alert("Gagal menyimpan data!");
      } finally {
        btn.innerText = "SIMPAN DATA NASABAH";
      }
    });

    // Search & Filter Data
    async function loadAndFilterNasabah() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">Loading data...</td></tr>`;

      try {
        const res = await fetch(`${GAS_API_URL}?action=getNasabah`);
        const result = await res.json();
        const allData = result.data || [];

        const searchNik = document.getElementById('searchNik').value.toLowerCase();
        const filterAngsuran = document.getElementById('filterAngsuran').value;
        const filterApproval = document.getElementById('filterApproval').value;
        const filterLimit = document.getElementById('filterLimit').value;

        const filtered = allData.filter(item => {
          const matchNik = !searchNik || String(item.NIK).toLowerCase().includes(searchNik);
          const matchAngsuran = filterAngsuran !== '3_plus' || Number(item.AngsuranKe) > 3;
          const matchApproval = !filterApproval || item.Approval === filterApproval;
          const matchLimit = filterLimit !== '1m_plus' || Number(item.SisaLimit) > 1000000;

          return matchNik && matchAngsuran && matchApproval && matchLimit;
        });

        tbody.innerHTML = '';
        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">Data tidak ditemukan.</td></tr>`;
          return;
        }

        filtered.forEach(item => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-700/50">
              <td class="p-2.5 font-mono">${item.NIK || '-'}</td>
              <td class="p-2.5 font-semibold text-white">${item.Nama || '-'}</td>
              <td class="p-2.5">${item.Finance || '-'}</td>
              <td class="p-2.5">Rp ${Number(item.JumlahPinjaman || 0).toLocaleString()}</td>
              <td class="p-2.5 font-semibold text-emerald-400">Rp ${Number(item.SisaLimit || 0).toLocaleString()}</td>
              <td class="p-2.5">${item.AngsuranKe || 0}</td>
              <td class="p-2.5">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.Approval === 'YA' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                  ${item.Approval || '-'}
                </span>
              </td>
            </tr>
          `;
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-400">Gagal mengambil data.</td></tr>`;
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
